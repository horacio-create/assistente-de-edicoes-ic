# Uso no servidor:  docker compose -f deploy/compose.yaml up -d --build
# Acesso: https://assistente-edicao.indoorchannel.com.br, pelo proxy "acesso" — ou túnel SSH para 127.0.0.1:8080.
# Com login (INDOOR_AUTH). Primeiro superadmin, depois do primeiro "up":
#   docker compose -f deploy/compose.yaml exec assistente python server.py criar-superadmin email@empresa.com.br
# A porta 8080 fica só na máquina (127.0.0.1); o proxy na frente é o único ponto de entrada.
name: assistente-edicoes
services:
  assistente:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: assistente-edicoes:latest
    container_name: assistente-edicoes
    environment:
      INDOOR_ALLOWED_HOSTS: "*"           # qualquer nome que chegue pelo proxy (a 8080 não é exposta)
      INDOOR_AUTH: "1"                    # login, cargos e convites (ver README, "Usuários e acesso")
      INDOOR_TRUSTED_PROXY: "*"           # confia no X-Forwarded-Proto do Caddy: cookie de sessão só em HTTPS
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dados:/dados                     # banco, mídias, vídeos e templates publicados
      - exportacoes:/exportacoes         # pasta de exportação de Imagens (use /exportacoes)
      - cache:/home/indoor/.cache        # Chrome e modelo de remoção de fundo (baixados uma vez)
    shm_size: 512m                       # o Chrome usa /dev/shm; o padrão de 64 MB derruba renders
    mem_limit: 2g                        # protege as outras aplicações do servidor durante um render
    cpus: 1.5
  acesso:
    image: caddy:2-alpine
    container_name: assistente-edicoes-acesso
    restart: unless-stopped
    depends_on: [assistente]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    mem_limit: 128m
volumes:
  dados:
  exportacoes:
  cache:
  caddy:
