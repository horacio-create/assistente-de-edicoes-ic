      .selo-preco .cent {

        padding-left: calc(var(--preco-inteiro) * .07);
      }
      /* Uma única escala mantém a mesma hierarquia com um ou mais inteiros. */
      .selo-preco[data-inteiros="1"] { --preco-inteiro: 123px; }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

      <div id="validade" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <span>Ofertas válidas para os dias</span>
        <b id="validade-datas"></b>
      </div>

      <!-- 3 painéis de 5s; cada um começa 0,35s antes do anterior sair (transição sobreposta) -->
      <div id="painel-1" class="clip painel" data-start="0" data-duration="5.35" data-track-index="2"></div>

        <div class="selo">
          <!-- Contorno vetorizado da referência original enviada pelo usuário. -->
          <svg class="selo-forma" viewBox="0 0 229 175" aria-hidden="true">
            <path fill="#5f4535" d="M52.32 174.16C31.81 171.78 11.83 156.36 4.51 137.25C0.30 126.26 0.43 128.08 0.43 81.07C0.43 32.24 0.37 32.98 5.51 21.26C10.13 10.76 22.12 4.39 43.84 0.91C53.38 -0.62 177.02 -0.31 187.05 1.27C208.15 4.59 218.47 10.61 223.86 22.73C228.44 33.06 228.57 34.65 228.57 81.92C228.57 125.67 228.57 125.67 226.16 132.73C219.88 151.06 204.53 166.57 187.83 171.47C185.71 172.10 183.01 173.05 181.83 173.58C179.34 174.72 61.67 175.25 52.32 174.16Z" />
            <path fill="#e9e112" d="M50.60 171.15C26.20 166.55 9.69 150.36 3.56 125.02C2.12 119.06 2.27 87.63 3.77 80.64C8.11 60.43 21.05 45.40 40.74 37.72C48.10 34.84 50.63 34.74 114.93 34.74C178.83 34.74 178.83 34.74 184.83 36.70C204.87 43.24 218.71 57.56 224.39 77.63C226.59 85.40 227.08 114.90 225.16 124.28C222.51 137.28 218.20 145.53 209.42 154.37C199.65 164.22 191.04 168.77 177.54 171.22C168.80 172.81 59.10 172.74 50.60 171.15Z" />

    <script>
      const v = window.__hyperframes.getVariables();
      const campo = (n, id) => v[`produtos_${n}_${id}`];
      const POR_PAINEL = 2;

      document.getElementById("validade-datas").textContent = v.validade;

      // A vírgula do selo fica na base dos inteiros, independente dos centavos elevados.
      function preencherPreco(el, preco, unidade, noSelo) {
        const [int, cent = "00"] = String(preco).split(",");
        el.dataset.inteiros = String(int.length);
        const valor =
          '<span class="int" data-layout-allow-overlap></span><span class="cent-box"><span class="cent" data-layout-allow-overlap></span><span class="un" data-layout-allow-overlap></span></span>';
        const conteudo = noSelo ? valor.replace('</span><span class="cent-box">', '</span><span class="virgula" data-layout-allow-overlap>,</span><span class="cent-box">') : valor;
        el.innerHTML = '<span class="rs" data-layout-allow-overlap>R$</span>' + (noSelo ? '<div class="valor"><div class="valor-conteudo">' + conteudo + "</div></div>" : conteudo);
        el.querySelector(".int").textContent = int;
        el.querySelector(".cent").textContent = (noSelo ? "" : ",") + cent;
        el.querySelector(".un").textContent = unidade;
      }

      function montarProduto(n) {
        const p = document.getElementById("tpl-produto").content.firstElementChild.cloneNode(true);
        p.querySelector(".nome").textContent = campo(n, "nome");
        const foto = p.querySelector(".foto");
        foto.src = campo(n, "imagem");
        foto.style.width = foto.style.height = (Number(campo(n, "tamanho")) || 1) * 100 + "%";
        preencherPreco(p.querySelector(".selo-preco"), campo(n, "por"), campo(n, "unidade"), true);
        if (String(campo(n, "de") || "").trim()) preencherPreco(p.querySelector(".de"), campo(n, "de"), campo(n, "unidade"), false);
        else p.querySelectorAll(".de, .seta").forEach((el) => el.remove());
        return p;
      }

      const tl = gsap.timeline({ paused: true });

      function animarProduto(p, inicio, D, i) {
        const t = inicio + i * 0.14;
        const box = p.querySelector(".foto-box");
        const foto = p.querySelector(".foto");
        const nome = p.querySelector(".nome");
        const selo = p.querySelector(".selo");
        const precoNormal = [...p.querySelectorAll(".de, .seta")];

        // ENTRADA — produto cai do topo e quica no quadro
        tl.fromTo(box, { y: -620, rotation: i ? 8 : -8 }, { y: 0, rotation: 0, duration: 1.0, ease: "bounce.out" }, t);
        // squash & stretch nos impactos do bounce
        tl.fromTo(foto, { scaleY: 1.12, scaleX: 0.92 }, { scaleY: 1, scaleX: 1, duration: 0.18, ease: "sine.out" }, t + 0.36)
          .to(foto, { scaleY: 0.9, scaleX: 1.08, duration: 0.07, ease: "sine.in" }, t + 0.54)
          .to(foto, { scaleY: 1, scaleX: 1, duration: 0.25, ease: "elastic.out(1.2,0.4)" }, t + 0.61);
        tl.fromTo(nome, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t + 0.4);

        // selo pula para dentro; preço normal desliza; seta aparece
        tl.fromTo(selo, { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.6)" }, t + 0.75);
        precoNormal.forEach((el, k) =>
          tl.fromTo(el, { x: k ? -14 : -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: k ? "back.out(2)" : "power2.out" }, t + 0.9 + k * 0.25),
        );

        // VIDA — quiques leves até a saída (repeat ímpar = termina em repouso)
        const meios = Math.floor((D - 0.5 - 1.35 - i * 0.14) / 0.42);
        tl.to(box, { y: -18, duration: 0.42, ease: "sine.out", yoyo: true, repeat: Math.max(1, meios % 2 ? meios - 2 : meios - 1) }, t + 1.35);
        tl.to(selo, { scale: 1.08, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + 2.1);
        tl.to(selo, { scale: 1.08, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + D - 1.6);

        // SAÍDA — itens saltam e saem pela esquerda enquanto o próximo painel cai
        const saida = inicio + D - 0.5 + i * 0.06;
        tl.to(box, { y: -120, x: -260, rotation: -18, scale: 0.7, opacity: 0, duration: 0.42, ease: "back.in(1.6)" }, saida);
        tl.to([nome, selo, ...precoNormal], { x: -180, opacity: 0, duration: 0.3, ease: "power2.in" }, saida + 0.05);
      }

      document.querySelectorAll(".painel").forEach((painel, k) => {
        const inicio = Number(painel.dataset.start);
        const D = Number(painel.dataset.duration);
        for (let i = 0; i < POR_PAINEL; i++) {
          const p = montarProduto(k * POR_PAINEL + i + 1);
          painel.appendChild(p);
          animarProduto(p, inicio, D, i);
        }
      });

      // Mede depois que a fonte local carregou; valores longos não atravessam a borda do selo.
      document.fonts.ready.then(() => {
        document.querySelectorAll('.selo-preco .valor').forEach((caixa) => {
          const conteudo = caixa.querySelector('.valor-conteudo');
          const escala = Math.min(1, caixa.clientWidth / Math.max(1, conteudo.scrollWidth));
          conteudo.style.transform = `scale(${escala})`;
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
