        src: url("assets/fonts/mplus-rounded-900.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3e7d3;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        color: #3b1d16;
      }
      #fundo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #validade {
        position: absolute;
        left: 1250px;
        width: 500px;
        top: 389px;
        text-align: center;
        color: #752020;
        font-size: 23px;
        line-height: 1.2;
      }
      #validade b {
        display: block;
        color: #b5121b;
        font-weight: 700;
        font-size: 24px;
      }

      /* painel = interior do quadro branco do fundo */
      .painel {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 470px;
        bottom: 86px;
        display: flex;
        justify-content: space-around;
        overflow: hidden;
        border-radius: 0 0 40px 40px;
      }
      .produto {
        position: relative;
        width: 820px;
        height: 100%;
      }
      .nome {
        font-family: "Bw Seido Round", sans-serif;
        font-synthesis: none;
        position: absolute;
        top: 6px;
        left: 90px;
        right: 90px;
        text-align: center;
        text-wrap: balance;
        font-weight: 900;
        font-size: 30px;
        line-height: 1.12;
      }
      /* tábua centralizada no produto (centro x=410); selo alinhado à borda direita da tábua */
      .foto-box {
        position: absolute;
        left: 120px;
        top: 58px;
        width: 580px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }
      .foto {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 18px 14px rgba(60, 25, 10, 0.28));
      }
      /* preço normal — medidas do VT original: dígitos ~67px de altura, 37px à esquerda do selo */
      .de {
        position: absolute;
        right: calc(100% - 375px);
        top: 368px;
        display: flex;
        align-items: flex-start;
        color: #5f4535;
        font-family: "Bw Seido Round", sans-serif;
        font-weight: 900;
      }
      .de .rs {
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1;
        margin: 16px 4px 0 0;
      }
      .de .int {
        font-size: 90px;
        line-height: 1;
        letter-spacing: 0;
      }
      .de .cent-box {
        display: block;
        margin-left: 2px;
      }
      .de .cent {
        display: block;
        font-size: 52px;
        line-height: 1;
        letter-spacing: 0;
        margin-top: 8px;
      }
      .de .un {
        display: block;
        text-align: right;
        padding-right: 4px;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 1;
        margin-top: -6px;
      }
      .seta {
        position: absolute;
        left: 364px;
        top: 446px;
        width: 44px;
        height: 26px;
        overflow: visible;
      }
      /* selo Clube de Desconto — medidas copiadas do VT original (229x175 @1080p) */
      .selo {
        position: absolute;
        left: 412px;
        top: 322px;
        width: 229px;
        height: 175px;
        color: #5f4535;
      }
      .selo-forma {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .selo-titulo {
        position: absolute;
        left: 0;
        right: 0;
        top: 9px;
        text-align: center;
        color: #fbf5ea;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 22.5px;
        line-height: 1;
      }
      .selo-preco {
        --preco-inteiro: 97px;
        position: absolute;
        left: 2px;
        right: 2px;
        top: 33px;
        bottom: 2px;
        font-family: "Bw Seido Round", sans-serif;
        font-weight: 900;
      }
      .selo-preco .rs {
        position: absolute;
        left: 0;
        right: 0;
        top: 15px;
        text-align: center;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1;
      }
      .selo-preco .valor {
        position: absolute;
        left: 11px;
        right: 11px;
        top: calc(129px - var(--preco-inteiro));
        display: flex;
        justify-content: center;
      }
      .selo-preco .valor-conteudo {
        display: inline-flex;
        flex-shrink: 0;
        gap: 1px;
        white-space: nowrap;
        transform-origin: center top;
      }
      .selo-preco .virgula {
        align-self: flex-start;
        font-size: calc(var(--preco-inteiro) * .42);
        line-height: 1;
        margin-top: calc(var(--preco-inteiro) * .17);
        margin-left: calc(var(--preco-inteiro) * .035);
        margin-right: 1px;
      }
      .selo-preco .int {
        font-size: var(--preco-inteiro);
        line-height: 1;
        letter-spacing: 0;
      }
      .selo-preco .cent-box {
        position: relative;
        display: block;
      }
      .selo-preco .cent {
        display: block;
        font-size: calc(var(--preco-inteiro) * .55);
        line-height: 1;
        letter-spacing: 0;
        margin-top: calc(var(--preco-inteiro) * .12);
      }
      .selo-preco .un {
        display: block;
        text-align: left;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: calc(var(--preco-inteiro) * .17);
        line-height: 1;
        margin-top: calc(var(--preco-inteiro) * .02);
        padding-left: calc(var(--preco-inteiro) * .07);
      }
      /* Uma única escala mantém a mesma hierarquia com um ou mais inteiros. */
      .selo-preco[data-inteiros="1"] { --preco-inteiro: 123px; }
      #validade{left:1290px;width:500px;top:359px;color:#466e1d;font-size:25px}#validade b{font-size:26px;color:#3c6216}.painel{left:48px;right:48px;top:465px;bottom:60px;border-radius:38px}
      .selo-preco[data-inteiros="1"]{--preco-inteiro:97px}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <img id="fundo" class="clip" src="assets/fundo.png" alt="" data-start="0" data-duration="15" data-track-index="0" />
      <div id="validade" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <span>Ofertas válidas para os dias</span>
        <b id="validade-datas"></b>
      </div>

      <!-- Cartelas criadas a partir da quantidade escolhida. -->
    </div>

    <template id="tpl-produto">
      <div class="produto">
        <div class="nome"></div>
        <div class="foto-box"><img class="foto" alt="" /></div>
        <div class="de" data-layout-allow-overlap></div>
        <svg class="seta" viewBox="0 0 44 26">
          <path d="M3 4 C 8 20, 26 24, 40 16 M31 13 L41 15.5 L35 23.5" fill="none" stroke="#3d2e27" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="selo">
          <!-- Contorno vetorizado da referência original enviada pelo usuário. -->
          <svg class="selo-forma" viewBox="0 0 229 175" aria-hidden="true">
            <path fill="#5f4535" d="M52.32 174.16C31.81 171.78 11.83 156.36 4.51 137.25C0.30 126.26 0.43 128.08 0.43 81.07C0.43 32.24 0.37 32.98 5.51 21.26C10.13 10.76 22.12 4.39 43.84 0.91C53.38 -0.62 177.02 -0.31 187.05 1.27C208.15 4.59 218.47 10.61 223.86 22.73C228.44 33.06 228.57 34.65 228.57 81.92C228.57 125.67 228.57 125.67 226.16 132.73C219.88 151.06 204.53 166.57 187.83 171.47C185.71 172.10 183.01 173.05 181.83 173.58C179.34 174.72 61.67 175.25 52.32 174.16Z" />
            <path fill="#e9e112" d="M50.60 171.15C26.20 166.55 9.69 150.36 3.56 125.02C2.12 119.06 2.27 87.63 3.77 80.64C8.11 60.43 21.05 45.40 40.74 37.72C48.10 34.84 50.63 34.74 114.93 34.74C178.83 34.74 178.83 34.74 184.83 36.70C204.87 43.24 218.71 57.56 224.39 77.63C226.59 85.40 227.08 114.90 225.16 124.28C222.51 137.28 218.20 145.53 209.42 154.37C199.65 164.22 191.04 168.77 177.54 171.22C168.80 172.81 59.10 172.74 50.60 171.15Z" />
          </svg>
          <div class="selo-titulo">Clube de Desconto</div>
          <div class="selo-preco"></div>
        </div>
      </div>
    </template>

    <script>
      const v = window.__hyperframes.getVariables();
      const campo = (n, id) => v[`produtos_${n}_${id}`];
      const total = Math.max(1, Math.min(150, Number(v.produtos_total) || 6));
      const grupos = Array.from({length: Math.floor(total / 2)}, () => 2);
      if (total % 2) {
        if (v.ultimacartela === "tres" && total >= 3) grupos[grupos.length - 1] = 3;
        else grupos.push(1);
      }
      const animacoes = v.animacoes !== false && new URLSearchParams(location.search).get("editar") !== "1";
      const duracaoCartela = 15 / grupos.length;

      document.getElementById("validade-datas").textContent = v.validade;

      // A vírgula do selo fica na base dos inteiros, independente dos centavos elevados.
      function preencherPreco(el, preco, unidade, noSelo) {
        const [int, cent = "00"] = String(preco).split(",");
        el.dataset.inteiros = String(int.length);
        const valor =
          '<span class="int" data-layout-allow-overlap></span><span class="cent-box"><span class="cent" data-layout-allow-overlap></span><span class="un" data-layout-allow-overlap></span></span>';
        const conteudo = noSelo ? valor.replace('</span><span class="cent-box">', '</span><span class="virgula" data-layout-allow-overlap>,</span><span class="cent-box">') : valor;
        el.innerHTML = '<span class="rs" data-layout-allow-overlap>R$</span>' + (noSelo ? '<div class="valor"><div class="valor-conteudo">' + conteudo + "</div></div>" : conteudo);
        el.querySelector(".int").textContent = int;
        el.querySelector(".cent").textContent = (noSelo ? "" : ",") + cent;
        el.querySelector(".un").textContent = unidade;
      }

      function montarProduto(n) {
        const p = document.getElementById("tpl-produto").content.firstElementChild.cloneNode(true);
        p.querySelector(".nome").textContent = campo(n, "nome");
        const foto = p.querySelector(".foto");
        foto.src = campo(n, "imagem");
        foto.style.width = foto.style.height = (Number(campo(n, "tamanho")) || 1) * 100 + "%";
        preencherPreco(p.querySelector(".selo-preco"), campo(n, "por"), campo(n, "unidade"), true);
        if (String(campo(n, "de") || "").trim()) preencherPreco(p.querySelector(".de"), campo(n, "de"), campo(n, "unidade"), false);
        else p.querySelectorAll(".de, .seta").forEach((el) => el.remove());
        const precos = document.createElement('div');
        precos.className = 'precos';
        p.querySelectorAll('.de, .seta, .selo').forEach(el => precos.appendChild(el));
        p.appendChild(precos);
        SelosOfertas.aplicar(p, v.estiloselo, campo(n, "estiloselo"), "amarelo");
        SelosOfertas.complemento(p, campo(n, "equivalenciapreco"), campo(n, "equivalenciaunidade"), campo(n, "equivalenciatexto"));
        SelosOfertas.promocao(p,campo(n,"promopreco"),campo(n,"promotexto"),campo(n,"promocores"),campo(n,"promounidade"));
        TagsOfertas.preparar(p, campo, n);
        EdicaoCartelas.preparar(p, n, campo(n, "edicao"));
        return p;
      }

      const tl = gsap.timeline({ paused: true });

      function animarProduto(p, inicio, D, i) {
        AnimacaoOfertas.animar(tl, p, inicio, D, i);
      }

      const animacoesPendentes = [];
      let indiceProduto = 1;
      grupos.forEach((quantidade, k) => {
        const painel = document.createElement("div");
        const inicio = k * duracaoCartela;
        painel.id = `painel-${k + 1}`;
        painel.className = "clip painel";
        painel.dataset.start = inicio;
        painel.dataset.duration = duracaoCartela;
        painel.dataset.trackIndex = k + 2;
        document.getElementById("root").appendChild(painel);
        for (let i = 0; i < quantidade; i++) {
          // Cada produto mantém o desenho original num espaço proporcional à sua coluna.
          const coluna = document.createElement("div");
          coluna.className = 'coluna-produto';
          coluna.style.cssText = `position:relative;flex:1;height:100%;min-width:0;display:flex;justify-content:center`;
          const p = montarProduto(indiceProduto++);
          p.dataset.porCartela = quantidade;
          p.style.flexShrink = "0";
          coluna.appendChild(p);
          painel.appendChild(coluna);
          animacoesPendentes.push({p, inicio, i});
        }
      });
      // Mantém a timeline seekable nos slides mesmo sem tweens visuais.
      const relogio = {tempo:0};
      tl.to(relogio, {tempo:15, duration:15, ease:"none"}, 0);

      // Mede depois que a fonte local carregou; valores longos não atravessam a borda do selo.
      Promise.all([document.fonts.ready, ...[...document.querySelectorAll('.foto')].map(img => img.decode().catch(() => {}))]).then(() => {
        LayoutOfertas.organizar([...document.querySelectorAll('.produto')], animacoes);
        document.querySelectorAll('.selo-preco .valor').forEach((caixa) => {
          const conteudo = caixa.querySelector('.valor-conteudo');
          const escala = Math.min(1, caixa.clientWidth / Math.max(1, conteudo.scrollWidth));
          conteudo.style.transform = `scale(${escala})`;
        });
        EdicaoCartelas.aplicar([...document.querySelectorAll(".produto")]);
        if (animacoes) animacoesPendentes.forEach(({p, inicio, i}) => {
          animarProduto(p, inicio, duracaoCartela, i);
        });
        window.__timelines["main"] = tl;
        EdicaoCartelas.iniciarEditor([...document.querySelectorAll(".produto")]);
      });
    </script>
  </body>
