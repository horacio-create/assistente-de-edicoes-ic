  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hora da Carne</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-weight: 400;
        src: url("assets/fonts/montserrat-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        src: url("assets/fonts/montserrat-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 900;
        src: url("assets/fonts/montserrat-900.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 700;
        src: url("assets/fonts/barlow-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "M PLUS Rounded 1c";
        font-weight: 900;
        src: url("assets/fonts/mplus-rounded-900.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3e7d3;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        color: #3b1d16;
      }
      #fundo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #validade {
        position: absolute;
        left: 1250px;
        width: 500px;
        top: 389px;
        text-align: center;
        color: #752020;
        font-size: 23px;
        line-height: 1.2;
      }
      #validade b {
        display: block;
        color: #b5121b;
        font-weight: 700;
        font-size: 24px;
      }

      /* painel = interior do quadro branco do fundo */
      .painel {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 472px;
        bottom: 90px;
        display: flex;
        justify-content: space-around;
        overflow: hidden;
        border-radius: 0 0 40px 40px;
      }
      .produto {
        position: relative;
        width: 820px;
        height: 100%;
      }
      .nome {
        position: absolute;
        top: 6px;
        left: 150px;
        right: 150px;
        text-align: center;
        text-wrap: balance;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.2;
        color: #333333;
      }
      /* tábua centralizada no produto (centro x=410); selo alinhado à borda direita da tábua */
      .foto-box {
        position: absolute;
        left: 120px;
        top: 86px;
        width: 580px;
        height: 272px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }
      .foto {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 18px 14px rgba(60, 25, 10, 0.28));
      }
      /* preço normal — medidas do VT original: dígitos ~67px de altura, 37px à esquerda do selo */
      .de {
        position: absolute;
        right: calc(100% - 400px);
        top: 372px;
        display: flex;
        align-items: flex-start;
        color: #2f2f2f;
        font-family: "M PLUS Rounded 1c", sans-serif;
        font-weight: 900;
      }
      .de .rs {
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1;
        margin: 16px 4px 0 0;
      }
      .de .int {
        font-size: 112px;
        line-height: 1;
        letter-spacing: -6px;
      }
      .de .cent-box {
        display: block;
        margin-left: -4px;
      }
      .de .cent {
        display: block;
        font-size: 60px;
        line-height: 1;
        letter-spacing: -3px;
        margin-top: 10px;
      }
      .de .un {
        display: block;
        text-align: right;
        padding-right: 4px;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 1;
        margin-top: -6px;
      }
      .seta {
        display: none;
        position: absolute;
        left: 364px;
        top: 446px;
        width: 44px;
        height: 26px;
        overflow: visible;
      }
      /* selo Clube de Desconto — medidas copiadas do VT original (229x175 @1080p) */
      .selo {
        position: absolute;
        left: 412px;
        top: 322px;
        width: 229px;
        height: 175px;
        background: #e6e533;
        border-radius: 30px;
        color: #e6e533;
      }
      .selo-titulo {
        position: absolute;
        left: 0;
        right: 0;
        top: 9px;
        text-align: center;
        color: #ad3325;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 22.5px;
        line-height: 1;
      }
      .selo-preco {
        position: absolute;
        left: 3px;
        right: 3px;
        top: 33px;
        bottom: 3px;
        background: #ad3325;
        border-radius: 24px;
        font-family: "M PLUS Rounded 1c", sans-serif;
        font-weight: 900;
      }
      .selo-preco .rs {
        position: absolute;
        left: 0;
        right: 0;
        top: 15px;
        text-align: center;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1;
      }
      .selo-preco .valor {
        position: absolute;
        left: 0;
        right: 0;
        top: 27px;
        display: flex;
        justify-content: center;
        gap: 0;
      }
      .selo-preco .int {
        font-size: 97px;
        line-height: 1;
        letter-spacing: -5px;
      }
      .selo-preco .cent-box {
        position: relative;
        display: block;
        margin-left: -4px;
      }
      .selo-preco .cent {
        display: block;
        font-size: 54px;
        line-height: 1;
        letter-spacing: -3px;
        margin-top: 6px;
      }
      .selo-preco .un {
        display: block;
        text-align: center;
        font-family: Barlow, sans-serif;
        font-weight: 700;
        font-size: 18px;
        line-height: 1;
        margin-top: -2px;
        padding-left: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <img id="fundo" class="clip" src="assets/fundo.png" alt="" data-start="0" data-duration="15" data-track-index="0" />
      <div id="validade" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <span>Ofertas válidas para os dias</span>
        <b id="validade-datas"></b>
      </div>

      <!-- até 6 cartelas; todas ocupam o vídeo inteiro e o script mostra cada uma na sua vez (opacity) -->
      <div id="painel-1" class="clip painel" data-start="0" data-duration="15" data-track-index="2"></div>
      <div id="painel-2" class="clip painel" data-start="0" data-duration="15" data-track-index="3"></div>
      <div id="painel-3" class="clip painel" data-start="0" data-duration="15" data-track-index="4"></div>
      <div id="painel-4" class="clip painel" data-start="0" data-duration="15" data-track-index="5"></div>
      <div id="painel-5" class="clip painel" data-start="0" data-duration="15" data-track-index="6"></div>
      <div id="painel-6" class="clip painel" data-start="0" data-duration="15" data-track-index="7"></div>
    </div>

    <template id="tpl-produto">
      <div class="produto">
        <div class="nome"></div>
        <div class="foto-box"><img class="foto" alt="" /></div>
        <div class="de" data-layout-allow-overlap></div>
        <svg class="seta" viewBox="0 0 44 26">
          <path d="M3 4 C 8 20, 26 24, 40 16 M31 13 L41 15.5 L35 23.5" fill="none" stroke="#3d2e27" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="selo">
          <div class="selo-titulo">Clube de Desconto</div>
          <div class="selo-preco"></div>
        </div>
      </div>
    </template>

    <script>
      const v = window.__hyperframes.getVariables();
      const campo = (n, id) => v[`produtos_${n}_${id}`];
      const POR_PAINEL = 2;

      document.getElementById("validade-datas").textContent = v.validade;

      // "14,99" -> R$ | 14 | ,99 | KG   (no selo: 14 | 99 sem vírgula, como no VT original)
      function preencherPreco(el, preco, unidade, noSelo) {
        const [int, cent = "00"] = String(preco).split(",");
        const valor =
          '<span class="int" data-layout-allow-overlap></span><span class="cent-box"><span class="cent" data-layout-allow-overlap></span><span class="un" data-layout-allow-overlap></span></span>';
        el.innerHTML = '<span class="rs" data-layout-allow-overlap>R$</span>' + (noSelo ? '<div class="valor">' + valor + "</div>" : valor);
        el.querySelector(".int").textContent = int;
        el.querySelector(".cent").textContent = "," + cent;
        el.querySelector(".un").textContent = unidade;
      }

      function montarProduto(n) {
        const p = document.getElementById("tpl-produto").content.firstElementChild.cloneNode(true);
        const nome = p.querySelector(".nome");
        nome.textContent = campo(n, "nome");
        // tamanho único (30px), quebrando em linhas equilibradas; nomes de 3 linhas empurram a foto para baixo
        if (String(campo(n, "nome") || "").length > 60) Object.assign(p.querySelector(".foto-box").style, { top: "122px", height: "236px" });
        const foto = p.querySelector(".foto");
        foto.src = campo(n, "imagem");
        foto.style.width = foto.style.height = (Number(campo(n, "tamanho")) || 1) * 100 + "%";
        preencherPreco(p.querySelector(".selo-preco"), campo(n, "por"), campo(n, "unidade"), true);
        if (String(campo(n, "de") || "").trim()) preencherPreco(p.querySelector(".de"), campo(n, "de"), campo(n, "unidade"), false);
        else p.querySelectorAll(".de, .seta").forEach((el) => el.remove());
        return p;
      }

      const tl = gsap.timeline({ paused: true });

      // Cartelas que vieram: 15s divididos entre elas (3 cartelas = 5s cada, como no original; 2 = 7,5s).
      // Troca seca entre cartelas (a nova começa vazia e os produtos crescem no lugar), como nos VTs da Uniforça.
      const TOTAL = Math.max(1, Number(v.produtos_total) || 6);
      const N = Math.ceil(TOTAL / POR_PAINEL);
      const D = 15 / N;
      // a entrada foi pensada para cartelas de 5s: nas mais curtas ela acelera
      const RITMO = Math.min(1, D / 5);

      // nome digitado letra a letra; as palavras não quebram no meio
      function letras(nome) {
        const texto = nome.textContent;
        nome.textContent = "";
        const spans = [];
        texto.split(/(\s+)/).forEach((parte) => {
          if (!parte) return;
          if (/^\s+$/.test(parte)) return nome.append(" ");
          const palavra = document.createElement("span");
          palavra.style.whiteSpace = "nowrap";
          for (const ch of parte) {
            const s = document.createElement("span");
            s.textContent = ch;
            palavra.append(s);
            spans.push(s);
          }
          nome.append(palavra);
        });
        return spans;
      }

      // Entrada suave: cada elemento só cresce ou aparece dentro da própria área (escala de 0 a 1, sem passar do
      // tamanho final e sem deslocamento), então o produto nunca passa por cima do nome nem dos preços.
      function animarProduto(alvo, p, inicio, i) {
        const t = inicio + 0.15 + i * 0.12;
        const box = p.querySelector(".foto-box");
        const selo = p.querySelector(".selo");
        const conteudoSelo = [...selo.children];
        const precoNormal = [...p.querySelectorAll(".de, .seta")];
        const nome = letras(p.querySelector(".nome"));

        // produto cresce no lugar, com um leve giro
        alvo.fromTo(box, { scale: 0, rotation: -28, transformOrigin: "50% 60%" }, { scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, t);
        // nome aparece letra a letra
        if (nome.length) alvo.fromTo(nome, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: Math.min(0.03, 0.5 / nome.length) }, t + 0.4);
        // selo abre para os lados; depois aparecem o texto e o preço dentro dele
        alvo.fromTo(selo, { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t + 0.55);
        alvo.fromTo(conteudoSelo, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, t + 0.8);
        // preço normal e seta
        if (precoNormal.length) alvo.fromTo(precoNormal, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, t + 0.8);
      }

      document.querySelectorAll(".painel").forEach((painel, k) => {
        // esconda com opacity: o runtime controla a visibility dos clipes
        painel.style.opacity = 0;
        if (k >= N) return;
        const inicio = k * D;
        tl.set(painel, { opacity: 1 }, inicio);
        if (k < N - 1) tl.set(painel, { opacity: 0 }, inicio + D);
        // a entrada é montada no ritmo de 5s e acelerada quando a cartela é mais curta
        const local = gsap.timeline();
        for (let i = 0; i < POR_PAINEL && k * POR_PAINEL + i < TOTAL; i++) {
          const p = montarProduto(k * POR_PAINEL + i + 1);
          painel.appendChild(p); // produto sozinho: o painel (flex, space-around) o centraliza
          animarProduto(local, p, 0, i);
        }
        tl.add(local.timeScale(1 / RITMO), inicio);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
